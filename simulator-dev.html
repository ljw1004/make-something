<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000000"><link rel="icon" type="image/png" sizes="64x64" href="./assets/appicon.png" vite-ignore><title>Make Something Worthwhile [story simulator]</title></head>
<body><main class="terminal">
  <h1><strong>MAKE SOMETHING WORTHWHILE</strong><br>
<span id="simulator-mode">[story simulator]</span></h1>
  <p id="status" role="status" hidden></p>
  <div id="transcript" role="log" aria-label="Terminal transcript" aria-live="polite" aria-relevant="additions"><pre id="story-picker"><!-- terminal-catalogue --></pre></div>
  <form id="prompt" hidden><label for="command"><span aria-hidden="true">&gt; </span><span class="sr-only">Command</span></label><input id="command" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Command"></form>
  <noscript>This terminal needs JavaScript to run the story engine.</noscript>
</main><script type="module" src="/src/web/text-terminal.ts"></script></body></html>
