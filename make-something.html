<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172830">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" type="image/png" sizes="64x64" href="./assets/appicon.png" >
  <title>Make Something Worthwhile</title>
  <!-- Keep the loading screen styled before the application bundle arrives. -->
  <style>.story-loading{color:#35382f;text-align:center;background:#f3eddf;place-items:center;margin:0;font:16px/1.5 system-ui,sans-serif;display:grid;position:absolute;inset:0}:root.story-entry-bootstrap{background:#000}:root.story-entry-bootstrap .story-loading{color:#0000;background:#000}:root.story-entry-bootstrap .story-loading:after{content:"";opacity:0;width:24px;height:24px;animation:story-loading-spin .7s linear infinite, story-show-spinner 0s var(--story-loading-spinner-delay,.24s) forwards;border:2px solid #f6efe255;border-top-color:#f6efe2;border-radius:50%;position:absolute}@keyframes story-loading-spin{to{transform:rotate(1turn)}}@keyframes story-show-spinner{to{opacity:1}}@media (prefers-reduced-motion:reduce){:root.story-entry-bootstrap .story-loading:after{animation:story-show-spinner 0s var(--story-loading-spinner-delay,.24s) forwards}}</style>
  <script>
    // Keep the handoff dark even if the application bundle is slow. The
    // player validates and consumes the same one-shot marker independently.
    try {
      const pending = JSON.parse(sessionStorage.getItem('make-something-entry-v1') || 'null');
      const referrer = new URL(document.referrer || (location.protocol === 'msw:' ? pending?.launch?.source : ''));
      const directory = new URL('./', location.href);
      const sameCatalogue = referrer.protocol === directory.protocol && referrer.host === directory.host &&
        ['', 'index.html', 'index-dev.html'].some(page => referrer.pathname === new URL(page, directory).pathname);
      const navigation = performance.getEntriesByType('navigation')[0];
      if (pending?.launch?.entry === 'carousel' && pending.launch.destination === location.href &&
          pending.expires > Date.now() && sameCatalogue && !history.state?.makeSomethingCarouselEntry &&
          navigation?.type !== 'reload' && navigation?.type !== 'back_forward') {
        document.documentElement.classList.add('story-entry-bootstrap');
      }
    } catch { /* Direct loading and the player remain available without storage. */ }
  </script>
  <script type="module" crossorigin src="./assets/make-something-Dbh2fx1q.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/markdown-DbWZas9U.js">
  <link rel="modulepreload" crossorigin href="./assets/carousel-selection-BKkvFqM1.js">
  <link rel="modulepreload" crossorigin href="./assets/placement-hints-D9t7ve0B.js">
  <link rel="modulepreload" crossorigin href="./assets/main-DhOUTjyY.js">
  <link rel="stylesheet" crossorigin href="./assets/main-BKnYJ4y5.css">
</head>
<body data-catalogue="./index.html">
  <div class="status-bar-color" aria-hidden="true"></div>
  <main id="workspace"><div id="app" aria-label="Game"><div class="game-surface"><p class="story-loading" role="status">Loading story…</p></div></div></main>
</body>
</html>
